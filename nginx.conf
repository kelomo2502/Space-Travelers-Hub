server {
    listen 80;
    # server_name _;  # Better to explicitly set to wildcard or remove for container usage

    location / {
        root /usr/share/nginx/html;  # Match Alpine's Nginx web root
        index index.html;
        try_files $uri $uri/ /index.html;  # Better handling of SPA routing
    }

    # If you need to serve static files separately (adjust if necessary)
    location /static/ {
        root /usr/share/nginx/html;  # Fix path to match new web root
        expires 1y;
        add_header Cache-Control "public";
    }

    # Handle client-side routing 404s
    error_page 404 /index.html;
    location = /index.html {
        internal;
    }
}