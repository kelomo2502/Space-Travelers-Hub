server {
    listen 0.0.0.0:80;     # IPv4
    listen [::]:80;         # IPv6
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        # Inherits root from server-level
        expires 1y;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
    location = /index.html {
        internal;
    }
}