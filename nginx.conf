server {
    listen 80;
    root /usr/share/nginx/html;  # Critical: Add this line at the SERVER level
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        # Inherits root from server-level
        expires 1y;
        add_header Cache-Control "public";
    }

    error_page 404 /index.html;
    location = /index.html {
        internal;
    }
}